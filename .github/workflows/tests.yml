# Runs on every push. The agent's own code changes (self-edit/* branches) are merged into main
# only when this passes, so keep it green. The agent is not allowed to edit this file.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install server dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Server tests
        working-directory: server
        run: python -m pytest -q
      - name: iMessage bridge tests
        run: python -m pytest -q imessage/tests
      - name: Laptop helper tests (no phone needed)
        working-directory: helper
        run: python -m pytest -q tests
